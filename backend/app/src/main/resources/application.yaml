spring:
  application:
    name: riverguard
  profiles:
    default: api
  datasource:
    url: ${RG_DB_URL}
    username: ${RG_DB_USER}
    password: ${RG_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 0
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1
  jdbc:
    template:
      query-timeout: 2
  flyway:
    # Task 7 adds authoritative migrations and enables migration startup.
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: []
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
